<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            border: 3px solid rgb(169, 20, 20);
            /* flex-item: start; */
            flex-direction: column;
            justify-content: center;
            gap: 30px;
            align-items: center;
            height: 400px;
            width: 400px;
        }

        .item {
            width: 40px;

            height: 40px;
            gap: 20px;
            border: 3px solid black;
            background-color: rgb(21, 158, 203);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        /* Navbar container */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            /* padding: 0.5rem 1rem; */
        }

        .navbar ul {
            list-style: none;
            display: flex;
            margin: 3px;
            padding: 3px;
        }   
        .navbar ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .navbar ul li {
            margin-right: 30px;
        }

        .navbar ul li a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .navbar ul li a:hover {
            color: #ff9800;
        }
    </style>
</head>

<body>
     <nav class="navbar">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
   
</body>

</html>
